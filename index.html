<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강슬기의 iphone</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #e7d2bf, #f5eee8, #d8c0a7);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .phone {
      width: 390px;
      max-width: 100%;
      height: 844px;
      background: #111;
      border-radius: 46px;
      padding: 12px;
      box-shadow: 0 28px 70px rgba(0,0,0,0.35);
      position: relative;
    }

    .screen {
      width: 100%;
      height: 100%;
      border-radius: 34px;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    .wallpaper {
      background: url('./wallpaper.jpg') center center / cover no-repeat;
    }

    .dark-layer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.18),
        rgba(0,0,0,0.12),
        rgba(0,0,0,0.22)
      );
      z-index: 1;
    }

    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 34px;
      background: #000;
      border-radius: 22px;
      z-index: 30;
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 25;
      padding: 18px 18px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }

    .lock-screen,
    .home-screen,
    .app-screen {
      position: absolute;
      inset: 0;
    }

    .lock-screen {
      z-index: 10;
    }

    .lock-content {
      position: relative;
      z-index: 5;
      height: 100%;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 108px 24px 30px;
      text-align: center;
    }

    .owner-label {
      margin-top: 18px;
      font-size: 15px;
      opacity: 0.95;
      letter-spacing: 0.2px;
    }

    .date {
      font-size: 20px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .time {
      font-size: 74px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .lock-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .lock-sub {
      font-size: 14px;
      line-height: 1.55;
      max-width: 270px;
      opacity: 0.96;
    }

    .unlock-btn {
      padding: 12px 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(12px);
      color: #fff;
      font-size: 14px;
    }

    .home-screen {
      display: none;
      z-index: 12;
    }

    .home-content {
      position: relative;
      z-index: 5;
      height: 100%;
      padding: 64px 18px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .home-top {
      color: #fff;
    }

    .home-owner {
      font-size: 28px;
      font-weight: 800;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.25);
    }

    .home-sub {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.95;
      line-height: 1.45;
      text-shadow: 0 1px 6px rgba(0,0,0,0.25);
    }

    .apps-grid {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 12px;
      align-content: start;
    }

    .app-icon-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
      border: none;
      background: transparent;
      color: #fff;
      padding: 0;
    }

    .app-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 22px rgba(0,0,0,0.22);
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-label {
      font-size: 12px;
      text-shadow: 0 1px 5px rgba(0,0,0,0.4);
    }

    .dock {
      padding: 10px 12px;
      border-radius: 28px;
      background: rgba(255,255,255,0.16);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .dock-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .dock .app-icon-wrap {
      width: 60px;
      height: 60px;
      margin: 0 auto;
    }

    .app-screen {
      display: none;
      z-index: 50;
      background: #f3f4f8;
      color: #111;
    }

    .app-topbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 52px 16px 14px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #e5e7ef;
    }

    .back-btn {
      border: none;
      background: #eceef5;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .app-title {
      font-size: 18px;
      font-weight: 800;
    }

    .app-content {
      height: calc(100% - 82px);
      overflow: auto;
      padding: 16px;
    }

    /* Kakao */
    .kakao-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-room {
      background: #fff;
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      display: flex;
      gap: 12px;
      align-items: center;
      cursor: pointer;
    }

    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: #fee500;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .chat-name {
      font-weight: 700;
      font-size: 15px;
    }

    .chat-time {
      font-size: 12px;
      color: #888;
      flex-shrink: 0;
    }

    .chat-preview {
      margin-top: 4px;
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-detail {
      display: none;
      height: 100%;
      background: #b8d1e8;
    }

    .chat-header {
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 52px 16px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(199,218,236,0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .chat-messages {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: calc(100% - 80px);
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .bubble-row.them {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble-row.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .bubble {
      padding: 11px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: keep-all;
      white-space: pre-line;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .bubble-row.them .bubble {
      background: #fff;
      color: #111;
      border-top-left-radius: 6px;
    }

    .bubble-row.me .bubble {
      background: #fee500;
      color: #111;
      border-top-right-radius: 6px;
    }

    .bubble-time {
      margin-top: 4px;
      font-size: 11px;
      color: rgba(0,0,0,0.55);
    }

    /* Notes */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-card {
      background: #fffef3;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .note-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .note-body {
      font-size: 14px;
      color: #444;
      line-height: 1.7;
      white-space: pre-line;
    }

    /* Phone log */
    .call-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .call-item {
      background: #fff;
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .call-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .call-name {
      font-size: 15px;
      font-weight: 700;
    }

    .call-meta {
      font-size: 13px;
      color: #666;
    }

    .call-time {
      font-size: 12px;
      color: #888;
      text-align: right;
      white-space: nowrap;
    }

    /* Photo / camera / instagram */
    .photo-card,
    .simple-card {
      background: #fff;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .photo-card img {
      width: 100%;
      border-radius: 16px;
      display: block;
    }

    .caption {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
      line-height: 1.6;
      white-space: pre-line;
    }

    .insta-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .insta-circle {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffcf5b, #ff5a78, #925cff);
      padding: 3px;
    }

    .insta-circle-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
    }

    .muted {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 430px) {
      body {
        padding: 0;
        background: #111;
      }

      .phone {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        padding: 0;
      }

      .screen {
        border-radius: 0;
      }
    }
  </style>
  <style>
  /* =========================
     KakaoTalk UI
     ========================= */

  #kakaoApp {
    background: #f6f6f7;
  }

  .kakao-main {
    display: block;

  }

  .kakao-header {
    padding: 54px 18px 12px;
    background: #f6f6f7;
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .kakao-header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .kakao-title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .kakao-header-icons {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 26px;
  }

  .kakao-filter-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .kakao-chip {
    border: none;
    border-radius: 999px;
    padding: 14px 18px;

    white-space: nowrap;
  }

  .kakao-chip.active {

  }

  .kakao-chip-badge {

  }

  .kakao-ad-card {

  .kakao-ad-top {
    font-size: 13px;
    color: #7f7f80;
    margin-bottom: 10px;
  }

  .kakao-ad-body {
    display: flex;
    justify-content: space-between;
    align-items: center;

  }

  .kakao-ad-text {
    font-size: 20px;
    font-weight: 800;

  .kakao-ad-thumb {

    justify-content: center;
    font-weight: 800;
    color: #222;
    font-size: 14px;
    text-align: center;
    flex-shrink: 0;
  }

  .kakao-room-list {
    padding: 14px 0 86px;
  }

  .kakao-room {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px 16px;
    cursor: pointer;
  }

  .kakao-room:hover {
    background: rgba(0,0,0,0.02);
  }

  .kakao-room-avatar {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    overflow: hidden;
    background: #ddd;
    flex-shrink: 0;
  }

  .kakao-room-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .kakao-room-avatar.fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #cfc8ff;
    color: #fff;
    font-size: 22px;
    font-weight: 800;
  }

  .kakao-room-body {
    flex: 1;
    min-width: 0;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    padding-bottom: 10px;
  }

  .kakao-room-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: flex-start;
  }

  .kakao-room-name {
    font-size: 18px;
    font-weight: 800;
    color: #111;
    line-height: 1.2;
  }

  .kakao-room-time {
    font-size: 14px;
    color: #8f8f90;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .kakao-room-preview-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    margin-top: 6px;
  }

  .kakao-room-preview {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    color: #787878;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .kakao-room-badge {
    min-width: 28px;
    height: 28px;
    padding: 0 8px;
    border-radius: 999px;
    background: #ef6c33;
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .kakao-bottom-nav {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 82px;
    background: rgba(247,247,248,0.97);
    border-top: 1px solid rgba(0,0,0,0.06);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: center;
    z-index: 4;
  }

  .kakao-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: #b4b4b6;
    position: relative;
    font-size: 26px;
  }

  .kakao-nav-item.active {
    color: #2c2c2d;
  }

  .kakao-nav-badge {
    position: absolute;
    top: -2px;
    right: 24%;
    min-width: 24px;
    height: 24px;
    padding: 0 7px;
    border-radius: 999px;
    background: #ef6c33;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  }

  .chat-detail-inner {

  }

  .chat-topbar {

  .chat-topbar-left,

  .chat-round-btn {

  .chat-room-title {

  .chat-banner {

  .chat-time {

  .chat-read {

  .chat-input-bar {
    background: #eaf0f5;

  .chat-input-shell {

  }

  .chat-plus {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #f0f1f3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }

  .chat-input-placeholder {
    flex: 1;
    color: #b0b0b1;
    font-size: 17px;
  }

  .chat-input-icons {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 28px;
    color: #222;
  }

              실제 촬영 기능은 없고, 스토리용 더미 화면이야.<br><br>
              원하면 나중에 “사진 찍는 척하는 UI”도 추가할 수 있어.

      <!-- 인스타 -->
      <section class="app-screen" id="instagramApp">
        <div class="app-topbar">
          <button class="back-btn" onclick="goHome()">← 홈</button>
          <div class="app-title">Instagram</div>
        </div>
        <div class="app-content">
          <div class="simple-card">
            <div class="insta-profile">
              <div class="insta-circle">
                <div class="insta-circle-inner">강</div>

                <div style="font-weight:800;">@kangseulgi</div>

              </div>
            </div>
            <div class="muted">
              여기도 나중에 게시물/스토리 형식으로 확장 가능해.<br>
              지금은 홈 화면 분위기용 앱으로 넣어둔 상태야.

      <!-- 사파리 -->
      <section class="app-screen" id="safariApp">
        <div class="app-topbar">
          <button class="back-btn" onclick="goHome()">← 홈</button>
          <div class="app-title">Safari</div>
        </div>
        <div class="app-content">
          <div class="simple-card">
            <div class="muted">
              Safari 더미 화면이야.<br><br>
              원하면 검색 기록, 열린 탭, 특정 사이트 화면처럼 꾸며줄 수도 있어.
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    /* =========================
       여기만 수정하면 됨
       ========================= */

    const PHONE_OWNER = "강슬기";

    const KAKAO_ROOMS = [
      {
        name: "혀니💛",
        avatar: "혀니",
        time: "오후 9:41",
        preview: "응급실 떡볶이 부상맛 오뎅튀김 추가 쿨피스 자두맛",
        messages: [
          { from: "them", text: "주이나 언제 와요?", time: "오후 9:35" },
          { from: "me", text: "나 지금 퇴근해~", time: "오후 9:36" },
          { from: "them", text: "올 때 떡볶이 사오면 안 되나...?", time: "오후 9:37" },
          { from: "them", text: "떡볶이가 나를 부르는데.", time: "오후 9:37" },
          { from: "me", text: "어디 떡볶이?", time: "오후 9:38" },
          { from: "them", text: "응급실 떡볶이 부상맛 오뎅튀김 추가 쿨피스 자두맛", time: "오후 9:41" },
        ]
      },
      {
        name: "손승완",
        avatar: "손",
        time: "오후 7:18",
        preview: "그냥 퇴근해 시간 너무 늦었다.",
        messages: [
          { from: "them", text: "저번에 말했던 거 주현씨 선물리스트 책상에 올려뒀어유", time: "오후 5:10" },
          { from: "me", text: "넵", time: "오후 5:16" },
          { from: "them", text: "오늘도 야근합니까", time: "오후 6:18" },
          { from: "me", text: "늘 그렇지 뭐... 미안.", time: "오후 6:18" },
          { from: "them", text: "김대표님이 파일 보내줬던 거 있어요?", time: "오후 7:10" },
          { from: "me", text: "있어. 내가 할게 그냥 퇴근해 시간 너무 늦었다.", time: "오후 7:12" },
        ]
      }
    ];

    const NOTES_DATA = [
      {
        title: "10월 18일",
        body: "혀니 선물 리스트 손승완한테 달라고 하기."
      },
      {
        title: "현백 상품권",
        body: "안마의자, 노트북? 신발... 음."
      }
    ];

    const CALL_LOGS = [
      {
        name: "손승완",
        type: "부재중 전화",
        detail: "휴대전화",
        time: "오늘 · 오후 6:14"
      },
      {
        name: "혀니💛",
        type: "발신",
        detail: "휴대전화 · 12분 33초",
        time: "오늘 · 오후 3:22"
      },
      {
        name: "청소이모",
        type: "수신",
        detail: "휴대전화 · 1분 02초",
        time: "어제 · 오후 11:48"
      }
    ];

    /* =========================
       기본 동작
       ========================= */

    const lockScreen = document.getElementById("lockScreen");
    const homeScreen = document.getElementById("homeScreen");

    const appIds = [
      "kakaoApp",
      "notesApp",
      "phoneApp",
      "photosApp",
      "cameraApp",
      "instagramApp",
      "safariApp"
    ];

    function updateTime() {
      const now = new Date();
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, "0");
      const time = `${h}:${m}`;
      const dayNames = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
      const date = `${now.getMonth()+1}월 ${now.getDate()}일 ${dayNames[now.getDay()]}`;

      document.getElementById("statusTime").textContent = time;
      document.getElementById("lockTime").textContent = time;
      document.getElementById("lockDate").textContent = date;
    }

    function unlockPhone() {
      lockScreen.style.display = "none";
      homeScreen.style.display = "block";
    }

    function hideAllApps() {
      appIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = "none";
      });
    }

    function openApp(appId) {
      homeScreen.style.display = "none";
      hideAllApps();
      const target = document.getElementById(appId);
      if (target) target.style.display = "block";
    }

    function goHome() {
      hideAllApps();
      homeScreen.style.display = "block";
    }

    lockScreen.addEventListener("click", unlockPhone);

    document.querySelectorAll(".app-icon-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const appId = btn.dataset.app;
        if (appId) openApp(appId);
      });
    });

    /* =========================
       카카오톡 렌더링
       ========================= */

    const kakaoRoomList = document.getElementById("kakaoRoomList");
    const chatDetailView = document.getElementById("chatDetailView");

    function renderKakaoRooms() {
      kakaoRoomList.innerHTML = "";

      KAKAO_ROOMS.forEach((room, index) => {
        const roomEl = document.createElement("div");
        roomEl.className = "chat-room";
        roomEl.innerHTML = `
          <div class="chat-avatar">${room.avatar || room.name.charAt(0)}</div>
          <div class="chat-info">
            <div class="chat-name-row">
              <div class="chat-name">${room.name}</div>
              <div class="chat-time">${room.time || ""}</div>
            </div>
            <div class="chat-preview">${room.preview || ""}</div>
          </div>
        `;
        roomEl.addEventListener("click", () => openChatDetail(index));
        kakaoRoomList.appendChild(roomEl);
      });
    }

    function openChatDetail(index) {
      const room = KAKAO_ROOMS[index];
      kakaoRoomList.style.display = "none";
      chatDetailView.style.display = "block";

      chatDetailView.innerHTML = `
        <div class="chat-header">
          <button class="back-btn" onclick="closeChatDetail()">← 목록</button>
          <div class="app-title">${room.name}</div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
      `;

      const chatMessages = document.getElementById("chatMessages");

      room.messages.forEach(msg => {
        const row = document.createElement("div");
        row.className = `bubble-row ${msg.from}`;
        row.innerHTML = `
          <div class="bubble">${msg.text}</div>
          <div class="bubble-time">${msg.time || ""}</div>
        `;
        chatMessages.appendChild(row);
      });
    }

    function closeChatDetail() {
      chatDetailView.style.display = "none";
      kakaoRoomList.style.display = "flex";
    }

    window.closeChatDetail = closeChatDetail;
    window.goHome = goHome;

    /* =========================
       메모 렌더링
       ========================= */

    const notesList = document.getElementById("notesList");

    function renderNotes() {
      notesList.innerHTML = "";
      NOTES_DATA.forEach(note => {
        const item = document.createElement("div");
        item.className = "note-card";
        item.innerHTML = `
          <div class="note-title">${note.title}</div>
          <div class="note-body">${note.body}</div>
        `;
        notesList.appendChild(item);
      });
    }

    /* =========================
       전화기록 렌더링
       ========================= */

    const callList = document.getElementById("callList");

    function renderCalls() {
      callList.innerHTML = "";
      CALL_LOGS.forEach(call => {
        const item = document.createElement("div");
        item.className = "call-item";
        item.innerHTML = `
          <div class="call-left">
            <div class="call-name">${call.name}</div>
            <div class="call-meta">${call.type} · ${call.detail}</div>
          </div>
          <div class="call-time">${call.time}</div>
        `;
        callList.appendChild(item);
      });
    }

    updateTime();
    setInterval(updateTime, 30000);
    renderKakaoRooms();
    renderNotes();
    renderCalls();
  </script>
</body>
