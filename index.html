<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>강슬기의 아이폰</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#e6dbd9;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}button{font:inherit;cursor:pointer}.phone{width:390px;height:min(844px,100dvh);padding:9px;background:#111;border-radius:44px;box-shadow:0 15px 60px #0005}.screen{position:relative;height:100%;border-radius:35px;overflow:hidden;background:#fff}.wallpaper{background:url('wallpaper.jpg') center/cover}.page{position:absolute;inset:0;display:none}.page.active{display:block}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:31px;background:#000;border-radius:20px;z-index:50;pointer-events:none}.status{position:absolute;top:0;left:0;right:0;padding:15px 22px;display:flex;justify-content:space-between;z-index:45;font-weight:700;font-size:14px;pointer-events:none}.status.light{color:#fff}.status.dark{color:#111}.shade{position:absolute;inset:0;background:linear-gradient(#0006,#0000 55%,#0005)}.lockbutton{position:absolute;inset:0;background:transparent;border:0;width:100%;color:white}.lockdate{position:absolute;top:112px;left:0;right:0;text-align:center;font-size:20px}.locktime{position:absolute;top:135px;left:0;right:0;text-align:center;font-size:73px;font-weight:650;letter-spacing:-3px}.hint{position:absolute;bottom:47px;left:0;right:0;text-align:center;font-size:15px}.home-inner{position:relative;height:100%;padding:78px 17px 20px;display:flex;justify-content:space-between;flex-direction:column}.apps,.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 4px}.appicon{border:0;background:transparent;color:#fff;text-shadow:0 1px 4px #0009;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:12px;padding:0}.appicon img,.emoji-icon{width:61px;height:61px;object-fit:cover;border-radius:16px;box-shadow:0 2px 12px #0004}.emoji-icon{background:#fff;display:grid;place-items:center;font-size:28px;text-shadow:none}.dock{padding:11px 6px;border-radius:26px;background:#d1dce866;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid #ffffff55;gap:4px}.app-page{background:#fff}.basichead{padding:59px 17px 15px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #eee}.basichead h2{margin:0;font-size:24px}.back{border:0;border-radius:25px;background:#f0f0f2;padding:8px 13px}.scroll{height:calc(100% - 112px);overflow-y:auto;padding:17px}.kakao{height:100%;display:flex;flex-direction:column}.khead{flex:none;padding:62px 16px 10px}.khead-row{display:flex;align-items:center;justify-content:space-between}.khead h2{font-size:27px;margin:0}.khead button{border:0;background:none;font-size:21px}.chips{display:flex;gap:7px;margin-top:18px;overflow-x:auto;scrollbar-width:none}.chips button{font-size:14px;background:#f0f0f0;border:0;border-radius:30px;padding:10px 15px;white-space:nowrap}.chips button.on{background:#111;color:#fff}.roomlist{flex:1;overflow-y:auto}.room{width:100%;display:flex;gap:12px;padding:12px 16px;background:#fff;border:0;text-align:left;align-items:center}.avatar{width:54px;height:54px;object-fit:cover;border-radius:21px;flex:none}.avatar.default{background:#b8bedd;color:white;display:grid;place-items:center;font-weight:bold;font-size:22px}.roominfo{flex:1;min-width:0}.roomtop{display:flex;justify-content:space-between;gap:4px}.roomname{font-size:17px;font-weight:700}.roomtime{color:#999;font-size:12px}.roompreview{font-size:14px;color:#888;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.unread{background:#ec6a33;color:#fff;border-radius:50px;padding:2px 7px;font-size:12px}.kbottom{height:75px;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;font-size:25px;color:#a5a5aa;flex:none}.chatpage{position:absolute;inset:0;background:#b2c4d4;display:none;flex-direction:column}.chatpage.open{display:flex}.chathead{padding:62px 14px 12px;display:flex;align-items:center;gap:12px}.chathead button{background:#ffffff77;border:1px solid #ffffff77;border-radius:23px;padding:7px 12px;font-size:17px}.chathead strong{flex:1;text-align:center;font-size:20px}.chatmessages{flex:1;overflow:auto;padding:15px 12px;display:flex;flex-direction:column;gap:14px}.msg{display:flex;gap:8px;align-items:flex-start}.msg.me{justify-content:flex-end}.msgbody{max-width:78%;display:flex;flex-direction:column;gap:5px}.msgavatar{width:35px;height:35px;border-radius:13px;object-fit:cover}.msgname{font-size:12px;color:#424a53}.msgline{display:flex;align-items:flex-end;gap:5px}.me .msgline{flex-direction:row-reverse}.bubble{padding:10px 12px;border-radius:14px;background:white;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;font-size:15px}.me .bubble{background:#fee548}.msgtime{font-size:10px;color:#5e6a74;white-space:nowrap}.chatinput{background:#e7edf3;padding:10px 12px 18px}.chatinput div{border-radius:28px;background:#fff;padding:13px;color:#a2a7af;display:flex;justify-content:space-between}.callhead{padding:65px 18px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:23px}.callhead button{border:0;border-radius:25px;background:#f4f4f5;padding:9px 13px;font-size:15px}.calllist{height:calc(100% - 171px);overflow:auto}.callrow{display:flex;align-items:center;gap:10px;padding:12px 15px;min-height:85px}.callavatar{height:52px;width:52px;flex:none;border-radius:50%;background:linear-gradient(#afc7e4,#8790bc);display:grid;place-items:center;color:white;font-size:17px;font-weight:700}.callbody{flex:1;min-width:0}.callname{font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.callname.missed{color:#df4c43}.calldesc{color:#999;font-size:13px;margin-top:5px}.callwhen{font-size:13px;color:#999;white-space:nowrap}.callbutton{background:#f3f4f6;border:0;border-radius:50%;width:43px;height:43px;color:#2886ff;font-size:21px}.callnav{position:absolute;bottom:13px;left:15px;right:15px;background:#f8f9fadf;border-radius:30px;padding:13px;display:flex;justify-content:space-around;font-size:13px}.note{padding:15px;background:#fff8d5;border-radius:14px;margin-bottom:12px;line-height:1.65}.note h3{margin:0 0 8px}.note p{white-space:pre-wrap;margin:0}.homebar{position:absolute;z-index:70;bottom:5px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:9px;background:#aaa;cursor:pointer}.homebar.white{background:#fff}@media(max-width:430px){body{background:#fff}.phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}}
</style></head><body><div class="phone"><div class="screen wallpaper"><div class="island"></div><div class="status light" id="status"><span id="clock">9:41</span><span>▮▮▮ 5G ▰</span></div>
<section class="page active" id="lock"><div class="shade"></div><button class="lockbutton" onclick="show('home')"><span class="lockdate" id="date"></span><span class="locktime" id="bigclock"></span><span class="hint">탭해서 열기 ⌃</span></button></section>
<section class="page" id="home"><div class="shade"></div><div class="home-inner"><div class="apps"><button class="appicon" onclick="show('kakao')"><img src="icon-kakao.jpg">카카오톡</button><button class="appicon" onclick="show('instagram')"><img src="icon-instagram.jpg">Instagram</button><button class="appicon" onclick="show('photos')"><img src="icon-photos.jpg">사진</button><button class="appicon" onclick="show('notes')"><span class="emoji-icon">📝</span>메모</button><button class="appicon" onclick="show('calls')"><img src="icon-phone.jpg">전화</button><button class="appicon" onclick="show('camera')"><img src="icon-camera.jpg">카메라</button></div><div class="dock"><button class="appicon" onclick="show('calls')"><img src="icon-phone.jpg"></button><button class="appicon" onclick="show('safari')"><img src="icon-safari.jpg"></button><button class="appicon" onclick="show('kakao')"><img src="icon-kakao.jpg"></button><button class="appicon" onclick="show('photos')"><img src="icon-photos.jpg"></button></div></div></section>
<section class="page app-page" id="kakao"><div class="kakao"><div class="khead"><div class="khead-row"><h2>채팅</h2><div><button onclick="searchRooms()">⌕</button><button onclick="show('home')">⚙</button></div></div><div class="chips"><button class="on" onclick="filterRooms(false,this)">전체</button><button onclick="filterRooms(true,this)">안읽음 <span id="unreadtotal">0</span></button><button onclick="filterRooms(false,this)">ChatGPT</button><button onclick="filterRooms(false,this)">통화</button></div></div><div class="roomlist" id="roomlist"></div><div class="kbottom"><span onclick="show('home')">♟</span><span>●</span><span>◉</span><span>▣</span><span>•••</span></div></div><div class="chatpage" id="chatpage"><div class="chathead"><button onclick="closeChat()">〈</button><strong id="chatname"></strong><button onclick="closeChat()">☰</button></div><div class="chatmessages" id="chatmessages"></div><div class="chatinput"><div><span>＋　메시지 입력</span><span>☺　＃</span></div></div></div></section>
<section class="page app-page" id="calls"><div class="callhead"><button onclick="show('home')">〈 홈</button><span>통화</span><button onclick="alert('가상 기록입니다.')">☰</button></div><div class="calllist" id="calllist"></div><div class="callnav"><span>🔵 통화</span><span>◉ 연락처</span><span>▦ 키패드</span><span>⌕ 검색</span></div></section>
<section class="page app-page" id="notes"><div class="basichead"><button class="back" onclick="show('home')">〈 홈</button><h2>메모</h2></div><div class="scroll" id="notelist"></div></section>
<section class="page app-page" id="photos"><div class="basichead"><button class="back" onclick="show('home')">〈 홈</button><h2>사진</h2></div><div class="scroll"><img src="wallpaper.jpg" style="width:100%;border-radius:14px"></div></section>
<section class="page app-page" id="instagram"><div class="basichead"><button class="back" onclick="show('home')">〈 홈</button><h2>Instagram</h2></div><div class="scroll">강슬기의 인스타그램 · 추후 확장 가능</div></section><section class="page app-page" id="camera"><div class="basichead"><button class="back" onclick="show('home')">〈 홈</button><h2>카메라</h2></div><div class="scroll">가상 카메라</div></section><section class="page app-page" id="safari"><div class="basichead"><button class="back" onclick="show('home')">〈 홈</button><h2>Safari</h2></div><div class="scroll">가상 Safari</div></section><div class="homebar white" id="homebar" onclick="show('home')"></div></div></div>
<script>
/* ★★★ 이 세 부분만 바꿔서 스토리를 편집하세요 ★★★ */
const PHONE_OWNER='강슬기';
const KAKAO_ROOMS=[
{name:'혀니',profile:'profile-hyeoni.jpg',time:'오후 5:57',unread:1,preview:'모해',messages:[
 {from:'them',text:'주이나 오늘 몇 시에 끝나?',time:'오전 11:55'},
 {from:'me',text:'8시에 끝나 오늘',time:'오전 11:56'},
 {from:'them',text:'올 때 떡볶이',time:'오전 11:56'},
 {from:'them',text:'응급실 부상맛 오뎅추가',time:'오전 11:56'},
 {from:'me',text:'이따가 같이 먹자',time:'오전 11:57'},
 {from:'them',text:'짜증나 주말에 출근하는 게 어딨어.',time:'오후 2:55'},
 {from:'me',text:'대표니까 어쩔 수 없지....',time:'오후 2:56'},
 {from:'them',text:'ㅡㅡ',time:'오후 3:16'},
 {from:'them',text:'물어 뜯어버릴거야',time:'오후 3:19'},
 {from:'me',text:'알았어 얼른 하고 갈게 ㅋㅋㅋㅋ',time:'오후 6:57',read:1},
]},
{name:'손승완',profile:'',time:'오후 4:30',unread:0,preview:'오키 고마워',messages:[
 {from:'them',text:'오늘도 주말 근무?',time:'오후 4:29'},
 {from:'me',text:'응 ㅋㅋ',time:'오후 4:30'}, 
 {from:'them',text:'주현씨 선물 리스트 보내드릴게요 이따가',time:'오후 4:29'},
 {from:'me',text:'오키 고마워',time:'오후 4:30'},
]},
{name:'카카오톡',profile:'icon-kakao.jpg',time:'오후 7:18',unread:1,preview:'[PC버전 자동로그인]',messages:[{from:'them',text:'[PC버전 자동로그인]',time:'오후 7:18'}]}
];
const NOTES_DATA=[{title:'10월 18일',body:'결혼기념일 선물 준비하기'},{title:'안마의자',body:'렌탈비용 12만원.'}];
const CALL_LOGS=[
{name:'혀니',direction:'↙',type:'휴대전화',time:'오후 9:13',missed:false},
{name:'R무역 김대표님',direction:'↙',type:'대한민국',time:'오전 11:16',missed:false},
{name:'혀니',direction:'↗',type:'휴대전화',time:'오전 11:13',missed:false},
{name:'손승완',direction:'↙',type:'카카오톡 음성 통화',time:'오전 10:20',missed:false},
{name:'혀니',direction:'↙',type:'휴대전화',time:'어제',missed:true}
];
/* ↓ 아래는 작동 코드입니다. */
const $=id=>document.getElementById(id);const E=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
function updateClock(){const d=new Date(),t=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;$('clock').textContent=t;$('bigclock').textContent=t;$('date').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][d.getDay()]}`}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));$('status').className='status '+(['home','lock'].includes(id)?'light':'dark');$('homebar').className='homebar'+(['home','lock'].includes(id)?' white':'');if(id==='kakao'){closeChat();renderRooms()}}
function avatar(room,cls='avatar'){if(!room.profile)return E('div',cls+' default',room.name[0]);const im=E('img',cls);im.src=room.profile;im.alt=room.name;im.onerror=()=>im.replaceWith(E('div',cls+' default',room.name[0]));return im}
let unreadOnly=false;function filterRooms(flag,btn){unreadOnly=flag;document.querySelectorAll('.chips button').forEach(x=>x.classList.toggle('on',x===btn));renderRooms()}
function searchRooms(){const q=prompt('채팅방 검색');if(q!==null)renderRooms(q)}
function renderRooms(q=''){const c=$('roomlist');c.replaceChildren();$('unreadtotal').textContent=KAKAO_ROOMS.reduce((a,r)=>a+(r.unread||0),0);KAKAO_ROOMS.forEach((r,i)=>{if((unreadOnly&&!r.unread)||(q&&!r.name.includes(q)))return;const row=E('button','room');row.appendChild(avatar(r));const info=E('div','roominfo'),top=E('div','roomtop'),preview=E('div','roomtop');top.append(E('span','roomname',r.name),E('span','roomtime',r.time));preview.appendChild(E('span','roompreview',r.preview||''));if(r.unread)preview.appendChild(E('span','unread',String(r.unread)));info.append(top,preview);row.appendChild(info);row.onclick=()=>openChat(i);c.appendChild(row)})}
function openChat(i){const r=KAKAO_ROOMS[i];$('chatname').textContent=r.name;const c=$('chatmessages');c.replaceChildren();r.messages.forEach(m=>{const row=E('div','msg '+m.from);if(m.from==='them')row.appendChild(avatar(r,'msgavatar'));const body=E('div','msgbody');if(m.from==='them')body.appendChild(E('div','msgname',r.name));const line=E('div','msgline');line.appendChild(E('div','bubble',m.text));line.appendChild(E('span','msgtime',(m.read?String(m.read)+'　':'')+(m.time||'')));body.appendChild(line);row.appendChild(body);c.appendChild(row)});$('chatpage').classList.add('open');requestAnimationFrame(()=>c.scrollTop=c.scrollHeight)}
function closeChat(){$('chatpage').classList.remove('open')}
function renderNotes(){const c=$('notelist');c.replaceChildren();NOTES_DATA.forEach(n=>{const card=E('div','note');card.append(E('h3','',n.title),E('p','',n.body));c.appendChild(card)})}
function renderCalls(){const c=$('calllist');c.replaceChildren();CALL_LOGS.forEach(r=>{const row=E('div','callrow');row.appendChild(E('div','callavatar',(r.name.match(/[가-힣]/g)||[]).slice(0,2).join('')||'◉'));const b=E('div','callbody');b.append(E('div','callname'+(r.missed?' missed':''),r.name),E('div','calldesc',(r.direction||'↙')+' '+r.type));row.append(b,E('span','callwhen',r.time));const btn=E('button','callbutton','☎');btn.onclick=()=>alert('가상 통화 기록입니다.');row.appendChild(btn);c.appendChild(row)})}
updateClock();setInterval(updateClock,30000);renderRooms();renderNotes();renderCalls();
</script></body></html>
